; LilyGO T-Display-S3 Pro. Default env is the HID-only composite device.
; kmj-debug adds a USB serial port so upload can auto-reset.
; The pio board id is the S3 module. Pro pins are in the firmware, not the variant.

[platformio]
default_envs = kmj

[env:kmj]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_protocol = esptool
upload_port = /dev/ttyACM0
board_upload.after_reset = watchdog-reset
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
    -Wl,--wrap=nimble_platform_mem_malloc
    -Wl,--wrap=nimble_platform_mem_calloc
    -Wl,--wrap=nimble_platform_mem_free
lib_deps =
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS
    lovyan03/LovyanGFX@^1.2.0
    lvgl/lvgl@^9.3.0
    h2zero/NimBLE-Arduino@^2.2.1

[env:kmj-debug]
extends = env:kmj
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
    -Wl,--wrap=nimble_platform_mem_malloc
    -Wl,--wrap=nimble_platform_mem_calloc
    -Wl,--wrap=nimble_platform_mem_free

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I include -I src -DUNIT_TEST
build_src_filter = +<logic/*.cpp>
test_build_src = yes
lib_ignore = SensorLib
