; KMJ firmware for the LilyGO T-Display-S3 Pro and the Waveshare
; ESP32-S3-Touch-LCD-1.85B. Default env is the HID-only composite device for
; the LilyGO; the -debug variants add a USB serial port so upload can
; auto-reset. The pio board id is the S3 module shared by both boards;
; per-board pins live in firmware/include/boards/.

[platformio]
default_envs = kmj

[common]
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
    -Wl,--wrap=nimble_platform_mem_malloc
    -Wl,--wrap=nimble_platform_mem_calloc
    -Wl,--wrap=nimble_platform_mem_free
    -Wl,--wrap=usb_persist_restart

[board_tdisplay_s3]
build_flags = -DKMJ_BOARD_TDISPLAY_S3

[board_ws185b]
build_flags = -DKMJ_BOARD_WS_185B

[env:kmj]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_protocol = esptool
upload_port = /dev/ttyACM0
board_upload.after_reset = watchdog-reset
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${common.build_flags}
    ${board_tdisplay_s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
extra_scripts =
    pre:tools/patch_nimble.py
    pre:tools/build_stamp.py
lib_deps =
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS
    lovyan03/LovyanGFX@^1.3.0
    lvgl/lvgl@^9.6.0
    h2zero/NimBLE-Arduino@^2.5.2

[env:kmj-debug]
extends = env:kmj
; The firmware's CDC port reboots into the ROM bootloader on a 1200 baud touch,
; so upload needs no BOOT button. esptool then skips its own DTR/RTS reset.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.before_reset = no-reset
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${common.build_flags}
    ${board_tdisplay_s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DKMJ_DEBUG_LOG=1

[env:kmj-ws185b]
extends = env:kmj
build_flags =
    ${common.build_flags}
    ${board_ws185b.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:kmj-ws185b-debug]
extends = env:kmj-debug
build_flags =
    ${common.build_flags}
    ${board_ws185b.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DKMJ_DEBUG_LOG=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I include -I src -DUNIT_TEST
build_src_filter = +<logic/*.cpp>
test_build_src = yes
lib_ignore = SensorLib
