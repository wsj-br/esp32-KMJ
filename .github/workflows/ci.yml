name: ci

on:
  release:
    types: [published]

jobs:
  firmware-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native -d firmware

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -e kmj -d firmware

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux capture libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libevdev-dev libdbus-1-dev
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace --exclude kmj-app
      - name: Tauri Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the desktop app
        run: cargo build --release -p kmj-app --manifest-path desktop/Cargo.toml
